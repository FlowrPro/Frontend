<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moborr.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell" aria-label="Moborr.io game" hidden>
    <canvas id="game-canvas" aria-label="Playable meadow map"></canvas>
    <aside id="minimap-panel" aria-label="Minimap">
      <canvas id="minimap-canvas"></canvas>
    </aside>
    <nav id="action-rail" aria-label="Game actions">
      <button class="action-button" type="button" data-action="inventory" aria-label="Open inventory" aria-expanded="false">
        <img src="assets/backpack.svg" alt="">
      </button>
    </nav>
    <section id="chat-panel" aria-label="Chat" hidden>
      <div id="chat-messages" aria-live="polite"></div>
      <label class="sr-only" for="chat-input">Chat message</label>
      <input id="chat-input" maxlength="180" autocomplete="off" placeholder="Type a message...">
    </section>
    <section id="inventory-panel" aria-label="Petal inventory" hidden>
      <header class="inventory-header">
        <h2>Inventory</h2>
        <button id="inventory-close" type="button" aria-label="Close inventory">&times;</button>
      </header>
      <div id="inventory-grid"></div>
    </section>
    <section id="hotbar" aria-label="Petal hotbar">
      <div id="hotbar-slots"></div>
    </section>
    <section id="secondary-hotbar" aria-label="Secondary petal hotbar">
      <div id="secondary-hotbar-slots"></div>
    </section>
    <section id="death-overlay" aria-label="You are defeated" hidden>
      <div class="death-card">
        <h2>Defeated</h2>
        <button id="respawn-button" type="button">Respawn</button>
      </div>
    </section>
  </main>
  <section id="home-screen" aria-label="Moborr.io home screen">
    <div class="home-content">
      <h1>Moborr.io</h1>
      <form id="play-form">
        <label class="sr-only" for="username-input">Username</label>
        <input id="username-input" name="username" maxlength="16" autocomplete="nickname" placeholder="Enter username" required>
        <button type="submit">Play</button>
      </form>
    </div>
  </section>
  <script src="game.js"></script>
</body>
</html>
